<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#2b2b2e"><title>لوحة مالك مطعم كمال</title>

<style>
/* لوحة المالك: نفس هوية صفحة الزبون، والتنقل في شريط سفلي */
:root{--bg:#faf8f5;--card:#fff;--ink:#231f1b;--mute:#6a625a;--brand:#2b2b2e;--brand-ink:#fff;--gold:#f08a1e;--gold-ink:#2a1700;--line:#e9e3dc;--soft:#f4efe9;--price:#b85a08;--ok:#1f9d55;--ok-soft:#e1f4e9;--warn-soft:#fdf1d3;--bad:#c0392b;--bad-soft:#fbe4e1;--info-soft:#fdeedb;--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e22;--ink:#f4f1ed;--mute:#b3aca3;--brand:#232326;--gold:#f59a2f;--line:#36343a;--soft:#2a292e;--price:#f59a2f;--ok:#46c47c;--ok-soft:#173a2a;--warn-soft:#3b3012;--bad:#ef7b6e;--bad-soft:#40201d;--info-soft:#3a2a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e22;--ink:#f4f1ed;--mute:#b3aca3;--brand:#232326;--gold:#f59a2f;--line:#36343a;--soft:#2a292e;--price:#f59a2f;--ok:#46c47c;--ok-soft:#173a2a;--warn-soft:#3b3012;--bad:#ef7b6e;--bad-soft:#40201d;--info-soft:#3a2a14;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
button,select,input,textarea{font-family:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* القوس حول الشعار */
.arch{position:relative;display:flex;align-items:flex-end;justify-content:center;width:236px;height:158px;margin:0 auto;padding-bottom:18px}
.arch svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round}
.arch img{position:relative;display:block;width:auto}

/* الدخول */
.login{max-width:380px;margin:0 auto;padding:36px var(--gr) 40px var(--gl);text-align:center}
.login .logo{height:72px}.login h1{margin:10px 0 4px;font-size:24px;font-weight:600}.login form{text-align:right}

function qrMatrix(text){

  put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,dc*8-bits.length));while(bits.length%8)bits.push(0);

  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const gen=Array(el-1).fill(0).concat([1]);{let root=1;for(let i=0;i<el;i++){for(let j=0;j<gen.length;j++){gen[j]=mul(gen[j],root);if(j+1<gen.length)gen[j]^=gen[j+1]}root=mul(root,2)}}
  const rs=d=>{const r=Array(el).fill(0);for(const b of d){const f=b^r.shift();r.push(0);gen.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const ns=nb-rc%nb,sl=Math.floor(rc/nb),blocks=[];

    for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}}
