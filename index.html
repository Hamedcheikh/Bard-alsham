.arch{position:relative;display:flex;align-items:flex-end;justify-content:center;width:236px;height:158px;margin:0 auto;padding-bottom:18px}
.arch svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round}
.top .logo{position:relative;display:block;height:72px;width:auto}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.mp{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:13.5px}
.mp svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-block;margin-top:10px;padding:2px 12px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:600}.chip:empty{display:none}
/* الورقة */
main{position:relative;margin-top:-34px;border-radius:30px 30px 0 0;min-height:70vh;padding:0 0 150px;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding:0 var(--gr) 0 var(--gl)}
.search{position:relative;margin:-26px 0 0;z-index:2}
.search input{width:100%;min-height:54px;padding:0 50px 0 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font-size:16px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.search svg{position:absolute;top:50%;right:18px;width:20px;height:20px;margin-top:-10px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
/* شريط التصنيفات الثابت */
.catbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin-top:12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 18px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font-size:15px;font-weight:500;white-space:nowrap}
.tab i{font-style:normal;font-size:20px;line-height:1}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
:root[data-theme="dark"] .tab.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px;font-size:20px;font-weight:700}.sec small{font-size:13px;font-weight:500;color:var(--mute)}
/* الأطباق */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;animation:rise .4s ease-out both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card.off{opacity:.6}.card.off .ph{filter:grayscale(1)}
.ph{position:relative;aspect-ratio:4/3;background:radial-gradient(circle at 30% 25%,var(--tint),var(--soft) 70%);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .em{font-size:52px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.pr{position:absolute;bottom:8px;right:8px;padding:2px 11px;border-radius:99px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pr b{color:var(--gold);font-weight:700}
.cb{display:flex;flex-direction:column;flex:1;padding:10px 12px 12px}
.cb h3{margin:0;font-size:16px;font-weight:600;line-height:1.4;cursor:pointer}
.cb p{margin:2px 0 8px;font-size:13px;line-height:1.55;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.ca{display:flex;justify-content:flex-start;min-height:40px;align-items:center}
.add{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border:0;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:14.5px;font-weight:700}
.add svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.add:active{transform:scale(.96)}
.qty{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:99px;background:var(--soft)}
.qty button{width:38px;height:38px;border:0;border-radius:50%;background:var(--card);color:var(--ink);font-size:20px;font-weight:600;line-height:1}
.qty button[data-a="inc"]{background:var(--gold);color:var(--gold-ink)}
.qty b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.out{font-size:13px;font-weight:600;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--mute)}
.foot{margin:22px 4px 0;font-size:13px;color:var(--mute);text-align:center}.foot:empty{display:none}
/* شريط الطلب */
.bar{position:fixed;inset:auto 0 0;z-index:12;padding:14px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl);background:linear-gradient(to top,var(--bg) 55%,transparent)}
.bar button{display:flex;width:100%;max-width:640px;min-height:58px;margin:0 auto;align-items:center;justify-content:space-between;gap:10px;padding:0 10px 0 22px;border:0;border-radius:99px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.32)}
.bar .cnt{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;margin-inline-end:8px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-weight:700}
#bt{padding:8px 18px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-variant-numeric:tabular-nums;font-weight:700}
/* النوافذ */
.veil{position:fixed;inset:0;z-index:20;background:rgba(20,16,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;padding:22px var(--gr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gl);animation:up .26s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 8px;font-size:21px;font-weight:700}
.line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lt{flex:none;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px;overflow:hidden}.lt img{width:100%;height:100%;object-fit:cover}
.line .ln{flex:1;min-width:0}.line .ln small{display:block;color:var(--mute);font-size:13px}
.sum{display:flex;justify-content:space-between;margin:14px 0;font-size:19px;font-weight:700}#total{color:var(--price)}
.fr{display:flex;justify-content:space-between;color:var(--mute);padding:6px 0}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mute)}
input,select{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px}
.send{display:block;width:100%;margin-top:16px;min-height:56px;line-height:56px;text-align:center;border:0;border-radius:99px;background:var(--ok);color:#fff;font-size:17px;font-weight:700;text-decoration:none}
.close{margin-top:8px;width:100%;min-height:44px;border:0;background:transparent;color:var(--mute);font-size:15px}
.dph{position:relative;aspect-ratio:16/10;margin:-4px 0 14px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 30% 25%,var(--tint),var(--soft) 70%);display:grid;place-items:center}.dph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.dph .em{font-size:84px}
.dsheet .dp{font-size:22px;font-weight:700;color:var(--price);margin:4px 0 10px}.dsheet p{margin:0 0 14px;color:var(--mute)}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.done{text-align:center;padding:10px 0}.done .ok{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--ok);color:#fff}.done .ok svg{width:32px;height:32px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.done .no{display:inline-block;margin:8px 0;padding:6px 22px;border-radius:14px;background:var(--soft);border:1.5px dashed var(--gold);font-size:28px;font-weight:700;letter-spacing:3px;direction:ltr}
.done p{color:var(--mute);margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>

function totals(){let n=0,t=0;for(const id in cart){n+=cart[id];t+=cart[id]*find(id).p}return{n,t}}
const feeNow=()=>($("#otype").value==="deliv"?(+S.r.fee||0):0);
function bar(){const{n,t}=totals();$("#bar").hidden=!n;$("#bn").textContent=n;$("#bt").textContent=fmt(t)}
function sheet(){const{t}=totals(),f=feeNow(),ty=$("#otype").value;
  $("#lines").innerHTML=Object.keys(cart).map(id=>{const i=find(id);return `<div class="line"><div class="lt">${imgUrl(i.img)?`<img src="${esc(imgUrl(i.img))}" alt="">`:esc(i.e||"🍽️")}</div><div class="ln">${esc(i.n)}<small>${fmt(i.p*cart[id])}</small></div><div class="qty"><button data-a="dec" data-id="${id}" aria-label="إنقاص">−</button><b>${cart[id]}</b><button data-a="inc" data-id="${id}" aria-label="زيادة">+</button></div></div>`}).join("");
  $("#feeRow").hidden=!f;$("#feeV").textContent=fmt(f);$("#total").textContent=fmt(t+f);
  $("#owl").textContent=ty==="dine"?"رقم الطاولة":ty==="deliv"?"العنوان أو أقرب معلم":"وقت الاستلام (اختياري)";
  $("#phw").hidden=ty==="dine"}
let dId=null;
function dsheet(){const i=find(dId);if(!i)return;$("#dsheet").innerHTML=`<div class="dph">${ph(i)}</div><h2>${esc(i.n)}</h2><div class="dp">${fmt(i.p)}</div><p>${esc(i.d)}</p><div class="drow">${ctrl(i)}</div><button class="close" id="dclose">إغلاق</button>`}
function change(id,d){const q=(cart[id]||0)+d;if(q<=0)delete cart[id];else cart[id]=q;list();bar();sheet();if(dId)dsheet();if(!Object.keys(cart).length)$("#veil").hidden=true}
function newNo(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function link(){if(!ordNo)ordNo=newNo();const f=feeNow(),ty=$("#otype").value,v=id=>$(id).value.trim();
  const rows=Object.keys(cart).map(id=>{const it=find(id);return "- "+cart[id]+" × "+it.n+" ("+cart[id]*it.p+" "+S.r.cur+")"});
  const L=["السلام عليكم، أريد الطلب من "+S.r.name+":","رقم الطلب: "+ordNo,...rows];
  if(f)L.push("رسوم التوصيل: "+f+" "+S.r.cur);
  L.push("المجموع: "+(totals().t+f)+" "+S.r.cur,"نوع الطلب: "+TYPE[ty]);
  if(v("#owhere"))L.push("الطاولة/العنوان: "+v("#owhere"));if(v("#oname"))L.push("الاسم: "+v("#oname"));
  if(ty!=="dine"&&v("#ophone"))L.push("الهاتف: "+v("#ophone"));if(v("#note"))L.push("ملاحظات: "+v("#note"));
  return "https://wa.me/"+S.r.wa+"?text="+encodeURIComponent(L.join("\n"))}
document.addEventListener("click",e=>{const t=e.target;
  const b=t.closest("[data-a]");if(b){change(b.dataset.id,b.dataset.a==="inc"?1:-1);return}
  const k=t.closest("[data-k]");if(k){active=k.dataset.k;$("#q").value="";tabs();list();return}
  const o=t.closest("[data-open]");if(o){dId=+o.dataset.open;dsheet();$("#dveil").hidden=false;return}
  if(t.id==="dclose"||t.id==="dveil"){$("#dveil").hidden=true;dId=null}});
$("#q").addEventListener("input",()=>{tabs();list()});
document.addEventListener("change",e=>{if(e.target.id==="otype")sheet()});
$("#open").onclick=()=>{sheet();$("#veil").hidden=false};$("#close").onclick=()=>{$("#veil").hidden=true};
$("#veil").onclick=e=>{if(e.target.id==="veil")$("#veil").hidden=true};
$("#send").onclick=e=>{const h=link();e.currentTarget.href=h;lastLink=h;const r=orderRec();post(r);$("#fno").textContent=ordNo;$("#again").href=h;ordNo=null;$("#veil").hidden=true;$("#fveil").hidden=false};
$("#fnew").onclick=()=>{cart={};$("#fveil").hidden=true;["#owhere","#oname","#ophone","#note"].forEach(s=>$(s).value="");list();bar();sheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#veil").hidden=true;$("#dveil").hidden=true;dId=null}});
head();tabs();list();bar();sheet();
const OK=window.APP&&/^https?:\/\//.test(APP.url||""),H=OK?{apikey:APP.key,...(String(APP.key).startsWith("eyJ")?{Authorization:"Bearer "+APP.key}:{})}:{};
function orderRec(){const f=feeNow(),ty=$("#otype").value,v=id=>$(id).value.trim();
  return{no:ordNo,items:Object.keys(cart).map(id=>({n:find(id).n,q:cart[id],p:find(id).p})),fee:f,total:totals().t+f,type:ty,where_:v("#owhere"),name:v("#oname"),phone:ty==="dine"?"":v("#ophone"),note:v("#note"),status:"new",pay:"unpaid",src:"qr"}}
function post(rec){if(!OK)return;try{fetch(APP.url+"/rest/v1/orders",{method:"POST",keepalive:true,headers:{...H,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(rec)}).catch(()=>{})}catch(e){}}
async function getJ(p){const r=await fetch(APP.url+"/rest/v1/"+p,{headers:H});if(!r.ok)throw 0;return r.json()}
function apply(m){S=m;if(!S.cats.some(c=>c[0]===active))active=S.cats[0][0];head();tabs();list();bar();sheet()}
async function loadMenu(){try{const m=JSON.parse(localStorage.getItem("menu")||"null");if(m&&m.items)apply(m)}catch(e){}
  if(!OK)return;try{const[s,c,i]=await Promise.all([getJ("settings?id=eq.1&select=*"),getJ("menu_cats?select=*&order=sort"),getJ("menu_items?select=*&order=sort")]);
    if(s[0]&&i.length){const m={r:{name:s[0].name,hours:s[0].hours,addr:s[0].addr,wa:s[0].wa,cur:s[0].cur||"أوقية",fee:+s[0].fee||0,demo:!!s[0].demo},cats:c.map(x=>[x.k,x.name]),items:i.map(x=>({id:x.id,c:x.c,n:x.n,d:x.d||"",p:+x.p,e:x.e||"",ok:!!x.ok,img:x.img||""}))};
      apply(m);try{localStorage.setItem("menu",JSON.stringify(m))}catch(e){}}}catch(e){}}
loadMenu();
</script></body></html>
